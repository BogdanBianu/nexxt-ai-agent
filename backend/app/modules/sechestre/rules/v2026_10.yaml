# Registrul de reguli pentru Modulul 2: Sechestre Asigurătorii (Civile & Penale)
# Sursa legală: Codul de procedură civilă (art. 952-959, art. 729) și Codul de procedură penală (art. 249-254)
version: "2026.10-sechestre"

parameters:
  salariu_minim_net: 2574
  cumulative_cap_on_periodic_income: 0.5
  creditor_priority: [INTRETINERE, FISCAL, COMERCIAL]
  freeze_deposits_and_savings: true
  immediate_external_transfer: false

periodic_categories: [SALARIU, PENSIE]

rules:
  - id: R-EXEMPT-01
    legal_source: "CPC art. 953 alin. (1) rap. la art. 729 alin. (7)"
    description: "Alocațiile de stat, indemnizațiile pentru copii, ajutoarele sociale și diurnele sunt exceptate de la sechestrul asigurător."
    categories: [ALOCATIE, INDEMNIZATIE_COPIL, DIURNA, AJUTOR_SOCIAL]
    quota: 0

  - id: R-SPECIAL-02
    legal_source: "CPC art. 953 rap. la art. 729 alin. (2)"
    description: "Indemnizația pentru incapacitate temporară de muncă este exceptată, cu excepția măsurilor asigurătorii pentru obligații de întreținere."
    categories: [INDEMNIZATIE_BOALA]
    quota: 0
    quota_if_creditor:
      INTRETINERE: 0.5

  - id: R-WAGE-03
    legal_source: "CPC art. 953 rap. la art. 729 alin. (1) lit. a)"
    description: "Veniturile din muncă/pensie pot fi indisponibilizate până la 1/2 pentru măsuri asigurătorii privind obligații de întreținere."
    categories: [SALARIU, PENSIE]
    creditor_types: [INTRETINERE]
    quota: 0.5

  - id: R-WAGE-04
    legal_source: "CPC art. 953 rap. la art. 729 alin. (1) lit. b)"
    description: "Veniturile din muncă/pensie pot fi indisponibilizate până la 1/3 pentru sechestre asigurătorii comerciale sau fiscale/penale."
    categories: [SALARIU, PENSIE]
    creditor_types: [COMERCIAL, FISCAL]
    quota: 0.3333333333

  - id: R-CONC-05
    legal_source: "CPC art. 729 alin. (3) / art. 956"
    description: "Concursul între sechestre asigurătorii și popriri pe venitul periodic nu poate depăși 1/2 din venitul net."

  - id: R-MIN-06
    legal_source: "CPC art. 729 alin. (4)"
    description: "Sub salariul minim net, măsura asigurătorie se aplică doar asupra părții ce depășește jumătate din acesta."

  - id: R-OTHER-07
    legal_source: "CPC art. 952 / CPP art. 249 alin. (1)"
    description: "Soldul existent, depozitele bancare, economiile și alte încasări non-salariale se îngheață integral până la plafonul sechestrului."
    categories: [ALT_VENIT, SOLD_ANTERIOR]
    quota: 1

  - id: R-CAP-08
    legal_source: "CPC art. 954 alin. (2) / CPP art. 249 alin. (5)"
    description: "Suma înghețată prin sechestru asigurător nu poate depăși plafonul (concurența sumei) dispus în ordonanță/încheiere."

  - id: R-PRIO-09
    legal_source: "CPC art. 865 și 956"
    description: "La concursul măsurilor asigurătorii și popririlor, ordinea de preferință este: întreținere, creanțe fiscale/stat, creanțe comerciale."

  - id: R-DUP-10
    legal_source: "CPC art. 954 / regulă internă de control"
    description: "Aceeași ordonanță sau încheiere de sechestru asigurător nu se instituie de două ori."
